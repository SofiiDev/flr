<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FlorLovesRunning</title>
  <meta name="description" content="Registra tus kilómetros, tiempos, comidas, macros y horas de sueño. Calcula macros de comidas y recetas con IA.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- color de la barra del sistema: app.js lo ajusta al modo elegido -->
  <meta name="theme-color" content="#F4F4F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0B0E" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FlorLovesRunning">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Inter+Tight:wght@600..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>

  <header class="topbar">
    <h1 id="viewTitle">Hoy</h1>
    <button id="settingsBtn" class="icon-btn avatar-btn" type="button" aria-label="Tu cuenta, ajustes y objetivos"></button>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button type="button" data-view="today">Hoy</button>
    <button type="button" data-view="runs">Correr</button>
    <button type="button" data-view="meals">Comidas</button>
    <button type="button" data-view="body">Cuerpo</button>
    <button type="button" data-view="summary">Resumen</button>
  </nav>

  <!-- Hoja inferior reutilizable para todos los formularios -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="Cerrar"></button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- generados en el despliegue (npm run build): cliente de Supabase y configuración pública -->
  <script src="vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
